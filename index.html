<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section>
    <div class="main">
      <div class="left">
        <h3>Gem: <span class="gem-cost">0</span></h3>
        <img src="./assets/gem-png.png" alt="gem" class="gem-image" draggable="false">
        <div class="reset-container">
          <button class="reset-button">RESET</button>
        </div>
      </div>
      <div class="right">
        <div class="upgrade clicker-upgrade">
          <div class="left-section"><img src="./assets/tap.png" alt="tap" class="upgrade-image"></div>
          <div class="mid-section">
            <h4>Clicker</h4>
            <div class="cost-info">
              <p>Cost: <span class="clicker-cost">10</span></p>
              <img src="./assets/gem-png.png" alt="" class="gem-img">
            </div>
          </div>
          <div class="right-section">level <span class="clicker-level">0</span></div>
          <div class="next-level-info"><p><span class="clicker-increase">1</span> gems per click</p></div>
        </div>

        <div class="upgrade pickaxe-upgrade">
          <div class="left-section"><img src="./assets/pickaxe.webp" alt="pickaxe" class="upgrade-image"></div>
          <div class="mid-section">
            <h4>Pickaxe</h4>
            <div class="cost-info">
              <p>Cost: <span class="pickaxe-cost">130</span></p>
              <img src="./assets/gem-png.png" alt="" class="gem-img">
            </div>
          </div>
          <div class="right-section">level <span class="pickaxe-level">0</span></div>
          <div class="next-level-info"><p><span class="pickaxe-increase">4</span> gems per second</p></div>
        </div>

        <div class="upgrade drill-upgrade">
          <div class="left-section"><img src="./assets/miner.webp" alt="drill" class="upgrade-image"></div>
          <div class="mid-section">
            <h4>Drill</h4>
            <div class="cost-info">
              <p>Cost: <span class="drill-cost">500</span></p>
              <img src="./assets/gem-png.png" alt="" class="gem-img">
            </div>
          </div>
          <div class="right-section">level <span class="drill-level">0</span></div>
          <div class="next-level-info"><p><span class="drill-increase">12</span> gems per second</p></div>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
